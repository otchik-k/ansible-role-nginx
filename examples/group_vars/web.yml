---
# Переменные для роли geerlingguy.nginx:
# reverse proxy + кеширование + раздача статики контейнерного приложения.

# Общие настройки nginx -------------------------------------------------------
nginx_remove_default_vhost: true

# Лимит загрузки файлов через прокси (подставьте размер ваших upload'ов).
nginx_client_max_body_size: "128m"

# Включаем gzip для текстовых ответов (статика бэкенда и проксируемый HTML).
nginx_extra_http_options: |
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/js
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# Директория прокси-кеша (создаётся отдельной задачей, см. playbook.yml).
# levels=1:2 — структура подкаталогов, max_size — размер кеша на диске,
# inactive — TTL неиспользуемых записей, use_temp_path — атомарная запись в кеш.
nginx_proxy_cache_path: "/var/cache/nginx/proxy levels=1:2 keys_zone=app_cache:16m max_size=2g inactive=60m use_temp_path=off"

# Upstream на бэкенд внутри docker-сети --------------------------------------
# keepalive экономит соединения к бэкенду (важно при proxy_pass http/1.1).
nginx_upstreams:
  - name: app_backend
    keepalive: 32
    servers:
      # Имя сервиса из docker-compose + порт контейнера
      # (при nginx вне docker-сети укажите проброшенный порт, напр. "127.0.0.1:8080").
      - "backend:8080"

# Виртуальные хосты ------------------------------------------------------------
nginx_vhosts:
  - listen: "80"
    server_name: "app.example.com"
    filename: "app.conf"
    root: "/srv/app/public"            # статика фронтенда, расшаренная из контейнера volume-ом
    index: "index.html"
    error_page: "404 /index.html"      # SPA: отдаём index.html на несуществующие маршруты
    access_log: "/var/log/nginx/app.access.log"
    extra_parameters: |
      # --- Загрузки (media/uploads): раздача с диска + длинное кеширование ---
      location /media/ {
          alias /srv/app/media/;       # volume с пользовательскими файлами
          expires 30d;
          add_header Cache-Control "public";
          tcp_nodelay off;
          tcp_nopush on;
      }

      # --- Статика фронтенда: без проксирования, агрессивно кешуемся --------
      # Имена js/css от vite/CRA содержат content-hash.
      location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
          try_files $uri @backend;     # если файла нет на диске — уходим на бэкенд
          expires 1y;
          add_header Cache-Control "public, immutable";
          access_log off;
      }

      # --- Маршруты SPA ------------------------------------------------------
      location / {
          try_files $uri $uri/ @backend;   # нет файла на диске — проксируем бэкенду
      }

      # --- Проксирование на бэкенд с прокси-кешем ----------------------------
      location @backend {
          proxy_cache app_cache;
          proxy_cache_valid 200 301 302 10m;
          proxy_cache_valid 404 1m;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          proxy_cache_lock on;
          proxy_cache_background_update on;
          # Не кешировать авторизованные запросы (куки/авторизация бэкенда).
          proxy_cache_bypass $http_cookie $http_authorization;
          proxy_no_cache $http_cookie $http_authorization;
          proxy_cache_key "$scheme$request_method$host$request_uri";
          add_header X-Cache-Status $upstream_cache_status;

          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Connection        "";
          proxy_read_timeout 60s;
          proxy_send_timeout 60s;
      }

      # Разрешить большие загрузки только на API-эндпоинтах.
      location /api/upload {
          client_max_body_size 512m;
          proxy_pass http://app_backend;
          proxy_request_buffering off;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
