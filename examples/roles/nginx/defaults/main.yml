---
# Настройки роли "nginx" (reverse proxy + кеширование + раздача статики
# контейнерного приложения). Переопределяйте их в group_vars/my_hosts.yml.

# Пакет и сервис
nginx_package_name: "nginx"
nginx_service_state: started
nginx_service_enabled: true

# Пути (переопределяются в vars/<os>.yml)
nginx_conf_file_path: /etc/nginx/nginx.conf
nginx_mime_file_path: /etc/nginx/mime.types
nginx_pidfile: /run/nginx.pid
nginx_conf_path: /etc/nginx/conf.d
nginx_vhost_path: /etc/nginx/sites-enabled
nginx_default_vhost_path: /etc/nginx/sites-enabled/default
nginx_root_group: root
nginx_user: "www-data"

# Основные параметры nginx.conf
nginx_worker_processes: >-
  "{{ ansible_facts.processor_vcpus | default(ansible_facts.processor_count) }}"
nginx_worker_connections: "1024"
nginx_multi_accept: "off"
nginx_error_log: "/var/log/nginx/error.log warn"
nginx_access_log: "/var/log/nginx/access.log main buffer=16k flush=2m"
nginx_sendfile: "on"
nginx_tcp_nopush: "on"
nginx_tcp_nodelay: "on"
nginx_keepalive_timeout: "75"
nginx_keepalive_requests: "600"
nginx_server_tokens: "on"
nginx_client_max_body_size: "128m"
nginx_server_names_hash_bucket_size: "64"
nginx_listen_ipv6: true

nginx_log_format: |-
  '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"'

# Доп. опции внутри http {} — здесь включён gzip для текстовых ответов.
nginx_extra_http_options: |
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_proxied any;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/js
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;

# Доп. опции внутри main context {} (по умолчанию пусто).
nginx_extra_conf_options: ""

# Удалить дефолтный vhost дистрибутива.
nginx_remove_default_vhost: true

# --- Приложение ---------------------------------------------------------------
# Каталоги, которые контейнер расшаривает на хост volume-ами:
#   volumes:
#     - ./public:/srv/app/public   # собранная статика фронта
#     - ./media:/srv/app/media     # пользовательские загрузки
nginx_app_static_root: "/srv/app/public"
nginx_app_media_root: "/srv/app/media"

# Прокси-кеш: путь, зона (16м ~ 140 тыс. ключей), макс. размер, TTL неиспользуемых.
nginx_proxy_cache_path: "/var/cache/nginx/proxy levels=1:2 keys_zone=app_cache:16m max_size=2g inactive=60m use_temp_path=off"

# Upstream на бэкенд-контейнер. keepalive экономит соединения (важно с
# proxy_http_version 1.1). Если nginx вне docker-сети — укажите проброшенный
# порт, например "127.0.0.1:8080".
nginx_upstreams:
  - name: app_backend
    keepalive: 32
    servers:
      - "backend:8080"

# Виртуальные хосты.
nginx_vhosts:
  - listen: "80"
    server_name: "app.example.com"
    filename: "app.conf"
    root: "{{ nginx_app_static_root }}"
    index: "index.html"
    error_page: "404 /index.html"      # SPA-fallback
    access_log: "/var/log/nginx/app.access.log"
    extra_parameters: |
      # --- Загрузки (media/uploads): раздача с диска + длинное кеширование ---
      location /media/ {
          alias {{ nginx_app_media_root }}/;
          expires 30d;
          add_header Cache-Control "public";
          tcp_nodelay off;
          tcp_nopush on;
      }

      # --- Статика фронтенда: без проксирования, агрессивно кешуемся --------
      # Имена js/css от vite/CRA содержат content-hash → можно immutable.
      location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
          try_files $uri @backend;
          expires 1y;
          add_header Cache-Control "public, immutable";
          access_log off;
      }

      # --- Маршруты SPA ------------------------------------------------------
      location / {
          try_files $uri $uri/ @backend;
      }

      # --- Проксирование на бэкенд с прокси-кешем ----------------------------
      location @backend {
          proxy_cache app_cache;
          proxy_cache_valid 200 301 302 10m;
          proxy_cache_valid 404 1m;
          proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
          proxy_cache_lock on;
          proxy_cache_background_update on;
          # Не кешировать авторизованные запросы (куки/авторизация бэкенда).
          proxy_cache_bypass $http_cookie $http_authorization;
          proxy_no_cache $http_cookie $http_authorization;
          proxy_cache_key "$scheme$request_method$host$request_uri";
          add_header X-Cache-Status $upstream_cache_status;

          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header Connection        "";
          proxy_read_timeout 60s;
          proxy_send_timeout 60s;
      }

      # Разрешить большие загрузки только на API-эндпоинтах.
      location /api/upload {
          client_max_body_size 512m;
          proxy_pass http://app_backend;
          proxy_request_buffering off;
          proxy_http_version 1.1;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
